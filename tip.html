<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="tip.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h2>Tip Calculator</h2>
            <button id="themeToggle">🌙</button>
        </div>

        <label for="bill">Bill Amount (₹)</label>
        <input type="number" id="bill" placeholder="Enter bill amount" min="0" step="0.01">

        <label for="tip">Tip Percentage (%)</label>
        <input type="number" id="tip" placeholder="Enter tip percentage" min="0" step="0.01">

        <div class="tip-buttons">
            <button class="tip-btn" data-tip="10">10%</button>
            <button class="tip-btn" data-tip="15">15%</button>
            <button class="tip-btn" data-tip="20">20%</button>
            <button class="tip-btn" data-tip="25">25%</button>
        </div>

        <label for="people">Number of People</label>
        <input type="number" id="people" placeholder="Enter number of people" min="1">

        <div class="options">
            <label><input type="checkbox" id="roundUp"> Round up per person</label>
        </div>

        <div class="button-container">
            <button id="calcBtn">Calculate</button>
            <button id="resetBtn">Reset</button>
        </div>

        <p id="result"></p>
        <button onclick="location.href='index.html'">
            Back to Home
        </button>

        <script src="tip.js"></script>
</body>

</html>
